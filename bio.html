<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LRS Elétrica</title>
<meta name="description" content="LRS Elétrica — fale no WhatsApp ou acesse nosso site.">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #1440d6;
    --blue-dark: #081b7a;
    --blue-darker: #050f4d;
    --yellow: #ffcf00;
    --yellow-dark: #cc9a00;
    --dark: #06070f;
    --text-muted: rgba(255,255,255,.75);
    --font-head: 'Rajdhani', 'Poppins', system-ui, sans-serif;
    --font-body: 'Poppins', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: radial-gradient(circle at 50% 0%, var(--blue-dark) 0%, var(--dark) 65%);
    font-family: var(--font-body);
    color: #fff;
  }
  body {
    display: flex;
    justify-content: center;
    padding: 40px 20px 32px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 18px;
  }
  .brand img { height: 42px; width: auto; }
  .brand span {
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 1.2rem;
    letter-spacing: .5px;
  }
  .brand strong { color: var(--yellow); }

  .mascot {
    width: min(72%, 300px);
    margin: 0 auto 8px;
    filter: drop-shadow(0 16px 30px rgba(0,0,0,.5));
  }
  .mascot img { width: 100%; height: auto; display: block; }

  h1 {
    font-family: var(--font-head);
    font-size: clamp(1.5rem, 6vw, 2rem);
    margin: 4px 0 6px;
  }
  h1 span { color: var(--yellow); }

  p.tagline {
    color: var(--text-muted);
    font-size: .95rem;
    margin: 0 0 28px;
    line-height: 1.5;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .link-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    border-radius: 16px;
    text-decoration: none;
    font-weight: 600;
    font-size: 1.02rem;
    color: #fff;
    background: rgba(255,255,255,.06);
    border: 1.5px solid rgba(255,255,255,.14);
    transition: transform .15s ease, background .15s ease, border-color .15s ease;
  }
  .link-btn:hover { transform: translateY(-3px); }
  .link-btn__icon {
    width: 42px; height: 42px;
    border-radius: 12px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .link-btn__text { text-align: left; }
  .link-btn__text small {
    display: block;
    font-weight: 400;
    font-size: .78rem;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .link-btn--whatsapp {
    background: linear-gradient(135deg, #25d366, #128c4a);
    border-color: transparent;
  }
  .link-btn--whatsapp .link-btn__icon { background: rgba(255,255,255,.18); }

  .link-btn--site {
    background: var(--yellow);
    color: var(--blue-darker);
    border-color: transparent;
  }
  .link-btn--site .link-btn__icon { background: rgba(5,15,77,.12); color: var(--blue-darker); }
  .link-btn--site .link-btn__text small { color: rgba(5,15,77,.65); }

  .link-btn--instagram {
    background: linear-gradient(135deg, #f58529, #dd2a7b, #8134af, #515bd4);
    border-color: transparent;
  }
  .link-btn--instagram .link-btn__icon { background: rgba(255,255,255,.2); }

  footer {
    margin-top: 36px;
    font-size: .78rem;
    color: rgba(255,255,255,.4);
  }
</style>
</head>

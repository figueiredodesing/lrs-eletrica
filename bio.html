<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LRS Elétrica</title>
<meta name="description" content="LRS Elétrica — fale no WhatsApp ou acesse nosso site.">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #1440d6;
    --blue-dark: #081b7a;
    --blue-darker: #050f4d;
    --yellow: #ffcf00;
    --yellow-dark: #cc9a00;
    --dark: #06070f;
    --text-muted: rgba(255,255,255,.75);
    --font-head: 'Rajdhani', 'Poppins', system-ui, sans-serif;
    --font-body: 'Poppins', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: radial-gradient(circle at 50% 0%, var(--blue-dark) 0%, var(--dark) 65%);
    font-family: var(--font-body);
    color: #fff;
  }
  body {
    display: flex;
    justify-content: center;
    padding: 40px 20px 32px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 18px;
  }
  .brand img { height: 64px; width: auto; }
  .brand span {
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 1.2rem;
    letter-spacing: .5px;
  }
  .brand strong { color: var(--yellow); }

  .mascot {
    width: min(72%, 300px);
    margin: 0 auto 8px;
    filter: drop-shadow(0 16px 30px rgba(0,0,0,.5));
  }
  .mascot img { width: 100%; height: auto; display: block; }

  h1 {
    font-family: var(--font-head);
    font-size: clamp(1.5rem, 6vw, 2rem);
    margin: 4px 0 6px;
  }
  h1 span { color: var(--yellow); }

  p.tagline {
    color: var(--text-muted);
    font-size: .95rem;
    margin: 0 0 28px;
    line-height: 1.5;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .link-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    border-radius: 16px;
    text-decoration: none;
    font-weight: 600;
    font-size: 1.02rem;
    color: #fff;
    background: rgba(255,255,255,.06);
    border: 1.5px solid rgba(255,255,255,.14);
    transition: transform .15s ease, background .15s ease, border-color .15s ease;
  }
  .link-btn:hover { transform: translateY(-3px); }
  .link-btn__icon {
    width: 42px; height: 42px;
    border-radius: 12px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .link-btn__text { text-align: left; }
  .link-btn__text small {
    display: block;
    font-weight: 400;
    font-size: .78rem;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .link-btn--whatsapp {
    background: linear-gradient(135deg, #25d366, #128c4a);
    border-color: transparent;
  }
  .link-btn--whatsapp .link-btn__icon { background: rgba(255,255,255,.18); }

  .link-btn--site {
    background: var(--yellow);
    color: var(--blue-darker);
    border-color: transparent;
  }
  .link-btn--site .link-btn__icon { background: rgba(5,15,77,.12); color: var(--blue-darker); }
  .link-btn--site .link-btn__text small { color: rgba(5,15,77,.65); }

  .link-btn--instagram {
    background: linear-gradient(135deg, #f58529, #dd2a7b, #8134af, #515bd4);
    border-color: transparent;
  }
  .link-btn--instagram .link-btn__icon { background: rgba(255,255,255,.2); }

  footer {
    margin-top: 36px;
    font-size: .78rem;
    color: rgba(255,255,255,.4);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="assets/logo.png" alt="LRS Elétrica" onerror="this.style.display='none'">
    </div>

    <div class="mascot">
      <img src="assets/mascotebio.png" alt="Mascote LRS Elétrica">
    </div>

    <h1>Excelência que <span>dá energia</span></h1>
    <p class="tagline">Instalação, manutenção e materiais elétricos com segurança e agilidade.</p>

    <div class="links">
      <a class="link-btn link-btn--whatsapp" href="https://wa.me/5533984217848?text=Ol%C3%A1%2C%20tudo%20bem%3F%20Gostaria%20de%20saber%20mais%20sobre%20os%20servi%C3%A7os%20ou%20solicitar%20um%20or%C3%A7amento." target="_blank" rel="noopener">
        <span class="link-btn__icon" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="24" height="24" fill="currentColor"><path d="M16 .3C7.4.3.4 7.2.4 15.8c0 2.7.7 5.3 2.1 7.7L.3 31.7l8.4-2.2c2.3 1.3 4.9 1.9 7.6 1.9 8.6 0 15.6-6.9 15.6-15.5C31.9 7.2 24.9.3 16 .3zm0 28.4c-2.4 0-4.7-.6-6.8-1.9l-.5-.3-5 1.3 1.3-4.8-.3-.5c-1.4-2.2-2.1-4.7-2.1-7.3 0-7.1 5.8-12.9 13.4-12.9 3.6 0 6.9 1.4 9.5 3.9 2.5 2.5 4 5.9 4 9.4-.1 7.2-5.9 13.1-13.5 13.1zm7.3-9.7c-.4-.2-2.4-1.2-2.7-1.3-.4-.1-.6-.2-.9.2-.3.4-1 1.3-1.2 1.5-.2.3-.4.3-.8.1-.4-.2-1.6-.6-3.1-1.9-1.1-1-1.9-2.3-2.2-2.6-.2-.4 0-.6.2-.8.2-.2.4-.4.6-.7.2-.2.3-.4.4-.6.1-.3 0-.5 0-.7-.1-.2-.9-2.2-1.3-3-.3-.8-.7-.7-.9-.7h-.8c-.3 0-.7.1-1 .5-.4.4-1.4 1.3-1.4 3.2s1.4 3.7 1.6 4c.2.3 2.8 4.2 6.7 5.9.9.4 1.7.6 2.3.8.9.3 1.8.3 2.4.2.7-.1 2.4-1 2.7-1.9.3-.9.3-1.7.2-1.9-.1-.2-.3-.3-.7-.5z"/></svg>
        </span>
        <span class="link-btn__text">
          Chamar no WhatsApp
          <small>(33) 98421-7848 · resposta rápida</small>
        </span>
      </a>

      <a class="link-btn link-btn--site" href="https://figueiredodesing.github.io/lrs-eletrica/" target="_blank" rel="noopener">
        <span class="link-btn__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M13 2 3 14h7l-1 8 11-14h-7l1-6z"/></svg>
        </span>
        <span class="link-btn__text">
          Acessar nosso site
          <small>Serviços, galeria e orçamento</small>
        </span>
      </a>
    </div>

    <footer>&copy; <span id="year"></span> LRS Elétrica</footer>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
